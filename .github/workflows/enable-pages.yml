name: Enable GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  enable:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Set source to main branch root
        id: legacy
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -x
          gh api "repos/${{ github.repository }}/pages" -X PUT \
            -f build_type=legacy \
            -F "source[branch]=main" \
            -F "source[path]=/"
          gh api "repos/${{ github.repository }}/pages"

      - name: Upload site
        if: steps.legacy.outcome != 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.legacy.outcome != 'success'
        uses: actions/deploy-pages@v4
